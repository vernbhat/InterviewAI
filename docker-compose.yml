services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interview_ai
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    ports:
      - "5432:5432"
    volumes:
      - interview_ai_postgres:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  interview_ai_postgres:
