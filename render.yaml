# Render blueprint (free web service). The free tier sleeps after 15 minutes idle
# and has an ephemeral disk, so interview history resets on redeploy.
services:
  - type: web
    name: interviewai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: EXECUTOR
        value: judge0            # never run untrusted code with the local executor on a public URL
      - key: JUDGE0_URL
        value: https://judge0-ce.p.rapidapi.com
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false              # optional: leave empty and let each user bring their own key
      - key: CORS_ORIGINS
        value: ""
